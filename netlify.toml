[build]
  # Schema changes are pushed deliberately via `npm run db:push` (Drizzle's
  # declarative push), not as an automatic build step — so build behaves
  # identically for previews and production, and no build needs DATABASE_URL.
  command = "npm run build:client"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  # sharp is a native addon — don't let the function bundler try to
  # tree-shake/bundle its .node binary. bcrypt was replaced with bcryptjs
  # (pure JS) specifically because a native-module load failure in the
  # Lambda runtime is a plausible cause of the "Internal server error" on
  # login — every login call hits bcrypt.compare, so any load/bundling
  # mismatch there fails every single login. bcryptjs is a drop-in,
  # hash-format-compatible replacement with no native binary to break.
  external_node_modules = ["sharp"]

# Security headers for everything the CDN serves (the HTML/JS/CSS). The
# Express/helmet CSP only rides on /api/* responses — JSON, where CSP does
# nothing — because static assets never pass through the function. This is
# the enforcement point that actually governs the app pages. ENFORCED (not
# report-only): verified against the built bundle — no inline <script>
# anywhere (registerSW.js is a file, not inline), fonts are the only
# third-party origin, all API/data fetches are same-origin.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=()"

# Order matters — first match wins. API and upload routes must be caught
# before the SPA fallback, or every request would 200 with index.html.
[[redirects]]
  # The extra "api" segment below is deliberate, not a typo: serverless-http's
  # basePath option (set in netlify/functions/api.ts) strips exactly
  # "/.netlify/functions/api" from the incoming path before handing it to
  # Express, and Express's routers are mounted at "/api/auth" etc (matching
  # local dev, where requests arrive as "/api/..." directly). Without this
  # extra segment the stripped path would be "/auth/login" instead of
  # "/api/auth/login", and every route would 404.
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/uploads/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
