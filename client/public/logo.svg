<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <defs>
    <!-- Shield outline path -->
    <clipPath id="shieldClip">
      <path d="M120,30 L160,60 L160,140 C160,180 120,220 120,220 C120,220 80,180 80,140 L80,60 Z"/>
    </clipPath>
  </defs>

  <!-- ═══ MAIN SHIELD SHAPE ═══════════════════════════════════════════════ -->
  <!-- Shield body with gradient-like effect -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F4D2A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield outer border (dark) -->
  <path d="M120,30 L160,60 L160,140 C160,180 120,220 120,220 C120,220 80,180 80,140 L80,60 Z"
        fill="url(#shieldGrad)" stroke="#063519" stroke-width="3"/>

  <!-- ═══ KENYA FLAG PATTERN INSIDE SHIELD ═══════════════════════════════ -->
  <!-- Black top band -->
  <rect x="85" y="50" width="70" height="20" fill="#0A0A0A"/>
  <!-- White thin divider -->
  <rect x="85" y="70" width="70" height="3" fill="#FFFFFF"/>
  <!-- Green middle band (already shield color, add accent) -->
  <rect x="85" y="73" width="70" height="25" fill="#006B3F" opacity="0.9"/>
  <!-- White thin divider -->
  <rect x="85" y="98" width="70" height="3" fill="#FFFFFF"/>
  <!-- Red bottom band -->
  <rect x="85" y="101" width="70" height="25" fill="#BB0000"/>

  <!-- ═══ MAASAI CULTURAL GEOMETRIC PATTERN ═════════════════════════════ -->
  <!-- Spear/vertical axis (symbol of warrior tradition) -->
  <line x1="120" y1="35" x2="120" y2="210" stroke="#D4A017" stroke-width="2"/>

  <!-- Three horizontal bars (Maasai pattern) -->
  <circle cx="120" cy="70" r="8" fill="#D4A017" opacity="0.8"/>
  <circle cx="120" cy="110" r="8" fill="#D4A017" opacity="0.8"/>
  <circle cx="120" cy="160" r="8" fill="#D4A017" opacity="0.8"/>

  <!-- ═══ HOUSE/COMMUNITY SYMBOL (subtle) ═════════════════════════════ -->
  <!-- Small house roof at bottom of shield -->
  <polygon points="120,180 105,195 135,195" fill="#F7F2E5" opacity="0.9"/>

  <!-- ═══ HIGHLIGHT ACCENT ═════════════════════════════════════════════ -->
  <!-- Top corner highlight for depth -->
  <path d="M85 70 Q90 65 95 70" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

  <!-- ═══ WORDMARK ═════════════════════════════════════════════════════ -->
  <!-- Main text: JiraniHub -->
  <text x="120" y="245"
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="700"
        font-size="32"
        fill="#0F4D2A"
        letter-spacing="-0.8">
    JiraniHub
  </text>

  <!-- Tagline: Smart Estate Management -->
  <text x="120" y="260"
        text-anchor="middle"
        font-family="'DM Sans', sans-serif"
        font-weight="400"
        font-size="11"
        fill="#6B5D45"
        letter-spacing="0.5">
    SMART ESTATE MANAGEMENT
  </text>
</svg>
