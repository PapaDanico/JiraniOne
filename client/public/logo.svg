<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 210" width="200" height="210">
  <defs>
    <!-- Inner circle clip (content stays inside circle) -->
    <clipPath id="innerCircle">
      <circle cx="100" cy="112" r="72"/>
    </clipPath>
    <!-- Shield clip -->
    <clipPath id="shieldClip">
      <ellipse cx="100" cy="112" rx="28" ry="44"/>
    </clipPath>
  </defs>

  <!-- ═══ BACKGROUND CIRCLE + FLAG BANDS ═══════════════════════════════ -->
  <!-- Black top band -->
  <rect x="28" y="52" width="144" height="52" fill="#111111" clip-path="url(#innerCircle)"/>
  <!-- Green middle band -->
  <rect x="28" y="88" width="144" height="48" fill="#1B5E20" clip-path="url(#innerCircle)"/>
  <!-- Red bottom band -->
  <rect x="28" y="136" width="144" height="52" fill="#B71C1C" clip-path="url(#innerCircle)"/>
  <!-- White thin dividers -->
  <rect x="28" y="86" width="144" height="4" fill="#ffffff" clip-path="url(#innerCircle)"/>
  <rect x="28" y="132" width="144" height="4" fill="#ffffff" clip-path="url(#innerCircle)"/>

  <!-- ═══ MAASAI SHIELD ═══════════════════════════════════════════════════ -->
  <!-- Shield body -->
  <ellipse cx="100" cy="112" rx="28" ry="44" fill="#111111"/>

  <!-- Shield: green patches (upper-left, upper-right quadrants) -->
  <path d="M72 112 Q72 72 100 70 L100 112 Z" fill="#1B5E20"/>
  <path d="M128 112 Q128 72 100 70 L100 112 Z" fill="#1B5E20"/>

  <!-- Shield: red patches (lower-left, lower-right quadrants) -->
  <path d="M72 112 Q72 152 100 154 L100 112 Z" fill="#B71C1C"/>
  <path d="M128 112 Q128 152 100 154 L100 112 Z" fill="#B71C1C"/>

  <!-- Shield: black vertical centre stripe -->
  <rect x="96" y="70" width="8" height="84" fill="#111111" clip-path="url(#shieldClip)"/>

  <!-- Shield: white oval central marking -->
  <ellipse cx="100" cy="112" rx="6" ry="12" fill="#ffffff"/>
  <!-- Small black dot inside oval -->
  <circle cx="100" cy="112" r="2" fill="#111111"/>

  <!-- ═══ OUTER BORDER: house-shaped circle ═══════════════════════════════ -->
  <!-- White inner ring (slightly inset) -->
  <circle cx="100" cy="112" r="72" fill="none" stroke="#ffffff" stroke-width="5"/>

  <!-- Outer thick black ring -->
  <circle cx="100" cy="112" r="76" fill="none" stroke="#111111" stroke-width="10"/>

  <!-- House roof outline (black, sits on top of circle) -->
  <!-- First cover the top arc with cream to "break" the circle for the roof -->
  <path d="M100 36 L160 82 A76 76 0 0 0 40 82 Z" fill="#f0ede5"/>
  <!-- White inner roof match -->
  <path d="M100 42 L154 83 A72 72 0 0 0 46 83 Z" fill="#f0ede5"/>

  <!-- Roof slopes (black lines) -->
  <line x1="100" y1="36" x2="40" y2="82" stroke="#111111" stroke-width="10" stroke-linecap="square"/>
  <line x1="100" y1="36" x2="160" y2="82" stroke="#111111" stroke-width="10" stroke-linecap="square"/>

  <!-- White inner roof lines -->
  <line x1="100" y1="46" x2="46" y2="85" stroke="#ffffff" stroke-width="5"/>
  <line x1="100" y1="46" x2="154" y2="85" stroke="#ffffff" stroke-width="5"/>

  <!-- Chimney (right side) -->
  <rect x="135" y="46" width="12" height="24" fill="#111111"/>
  <rect x="137" y="49" width="8" height="20" fill="#f0ede5"/>

  <!-- Roof ridge cap (black dot at apex) -->
  <circle cx="100" cy="36" r="5" fill="#111111"/>

  <!-- ═══ WORDMARK ════════════════════════════════════════════════════════ -->
  <text
    x="100" y="205"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'IBM Plex Sans', Arial Black, sans-serif"
    font-weight="800"
    font-size="28"
    fill="#111111"
    letter-spacing="-0.5"
  >JiraniHub</text>
</svg>
