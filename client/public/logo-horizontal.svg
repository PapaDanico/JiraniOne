<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60">
  <defs>
    <linearGradient id="hShieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F4D2A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- ═══ COMPACT SHIELD ICON (LEFT) ═════════════════════════════════ -->
  <!-- Shield -->
  <path d="M20,8 L32,15 L32,28 C32,35 20,42 20,42 C20,42 8,35 8,28 L8,15 Z"
        fill="url(#hShieldGrad)" stroke="#063519" stroke-width="1.2"/>

  <!-- Flag stripes -->
  <rect x="12" y="14" width="16" height="2.5" fill="#0A0A0A"/>
  <rect x="12" y="16.5" width="16" height="2.5" fill="#006B3F"/>
  <rect x="12" y="19" width="16" height="2.5" fill="#BB0000"/>

  <!-- Center accent -->
  <line x1="20" y1="10" x2="20" y2="38" stroke="#D4A017" stroke-width="1"/>
  <circle cx="20" cy="18" r="1.5" fill="#D4A017" opacity="0.8"/>

  <!-- ═══ WORDMARK (RIGHT) ═══════════════════════════════════════════ -->
  <!-- Main text -->
  <text x="50" y="38"
        font-family="'Plus Jakarta Sans', sans-serif"
        font-weight="700"
        font-size="28"
        fill="#0F4D2A"
        letter-spacing="-0.6">
    JiraniHub
  </text>

  <!-- Optional: Small tagline on right -->
  <text x="50" y="52"
        font-family="'DM Sans', sans-serif"
        font-weight="500"
        font-size="9"
        fill="#1B5E20"
        letter-spacing="0.5"
        opacity="0.7">
    SMART ESTATE MANAGEMENT
  </text>
</svg>
