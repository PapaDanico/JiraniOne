<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F4D2A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M16,2 L24,8 L24,16 C24,22 16,28 16,28 C16,28 8,22 8,16 L8,8 Z"
        fill="url(#fg)" stroke="#063519" stroke-width="0.5"/>

  <!-- Kenya flag stripes -->
  <rect x="10" y="7" width="12" height="2.5" fill="#0A0A0A"/>
  <rect x="10" y="9.5" width="12" height="2.5" fill="#006B3F"/>
  <rect x="10" y="12" width="12" height="2.5" fill="#BB0000"/>

  <!-- Center accent (spear) -->
  <line x1="16" y1="5" x2="16" y2="24" stroke="#D4A017" stroke-width="0.8"/>
  <circle cx="16" cy="11" r="1.2" fill="#D4A017" opacity="0.8"/>

  <!-- Small white highlight -->
  <path d="M10 9.5 Q12 8 14 9.5" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.6"/>
</svg>
