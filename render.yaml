services:
  - type: web
    name: jiranihub
    runtime: node
    region: fra  # Frankfurt — closest to Kenya
    plan: starter
    # Build needs devDeps (vite, esbuild, drizzle-kit) — do not pass --omit=dev.
    buildCommand: npm install && npm run build
    # All scripts use IF NOT EXISTS and are safe to re-run on every deploy.
    preDeployCommand: node migrate-new-features.mjs && node migrate-password-reset.mjs && node migrate-payment-integrity.mjs && node migrate-anonymous-polls.mjs && node migrate-setup-links.mjs
    startCommand: node dist/server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://www.jiranihub.co.ke
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: https://www.jiranihub.co.ke/api/payments/mpesa/callback
      - key: SMS_API_KEY
        sync: false
      - key: SMS_USERNAME
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false          # optional — enables live Mombasa Road traffic times
      - key: SENTRY_DSN
        sync: false          # optional — enables Sentry error reporting (no DSN = no-op)
      - key: SENTRY_TRACE_SAMPLE_RATE
        value: "0.1"
      - key: SMS_PER_USER_DAILY_CAP
        value: "30"
      - key: SMS_GLOBAL_DAILY_CAP
        value: "5000"
      - key: MPESA_CALLBACK_ALLOWED_IPS
        sync: false          # optional override — comma-separated Safaricom egress IPs
