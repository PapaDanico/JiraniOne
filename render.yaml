services:
  - type: web
    name: jiranihub
    runtime: node
    region: fra  # Frankfurt — closest to Kenya
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node dist/server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://www.jiranihub.co.ke
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: https://www.jiranihub.co.ke/api/payments/mpesa/callback
      - key: SMS_API_KEY
        sync: false
      - key: SMS_USERNAME
        sync: false
